name: Bug report
description: Something in ColorBrush does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: plasma
    attributes:
      label: Plasma version
      placeholder: "e.g. 6.7.5 (plasmashell --version)"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      placeholder: "e.g. Fedora 44, Arch, openSUSE Tumbleweed"
  - type: dropdown
    id: session
    attributes:
      label: Session type
      options: [Wayland, X11]
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: "Run `plasmawindowed org.seaq.colorbrush` in a terminal and paste the output."
      render: shell
